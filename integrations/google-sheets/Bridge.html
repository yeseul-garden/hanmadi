<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
(function(){
  'use strict';
  const config = <?!= bootstrap ?>;
  const send = message => window.top.postMessage(Object.assign({hanmadiSheets:1,channel:config.channel},message),config.origin);
  let active = false;
  window.addEventListener('message',function(e){
    if (e.source !== window.top || e.origin !== config.origin) return;
    const m = e.data;
    if (!m || m.hanmadiSheets !== 1 || m.channel !== config.channel || typeof m.id !== 'string' || active) return;
    if (!['health','submit'].includes(m.action)) return;
    active = true;
    const runner = google.script.run.withSuccessHandler(function(result){active=false;send({id:m.id,result:result});})
      .withFailureHandler(function(error){active=false;const message=String(error && error.message || error);const code=['HEADER_MISMATCH','CONTROL_SHEET_MISMATCH','CONTROL_SHEET_MISSING','RUN_INITIALIZE','SETUP_REQUIRED','INVALID_INPUT','EVENT_MISMATCH','RETRY_MISMATCH','BUSY_RETRY','SUBMISSIONS_CLOSED','NAME_TAKEN'].find(c=>message.includes(c)) || 'SAVE_FAILED';send({id:m.id,error:code});});
    if (m.action === 'health') runner.healthHanmadi(); else runner.submitHanmadi(m.payload);
  });
  send({ready:true});
})();
</script></body></html>
